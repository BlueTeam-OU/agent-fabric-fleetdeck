name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  # Keep file/line backtraces without generating type and variable debug information.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  # PR caches are visible only to their own PR, and every save pushes the
  # repository toward GitHub's cache limit, evicting the master caches PRs
  # restore from. Only branch pushes save.
  SAVE_CACHES: ${{ github.event_name == 'push' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    if: github.event_name != 'push' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit subjects
        if: github.event_name == 'push'
        run: python3 scripts/conventional_commits.py --range "${{ github.event.before }}..${{ github.event.after }}"

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/conventional_commits.py "$PR_TITLE"

  # The dependency policy (deny.toml) and unused dependencies, over the
  # committed Cargo.lock. Both tools are the upstream release binaries,
  # checked against their pinned sha256 before they are unpacked, rather
  # than an action or `cargo install`: an action that runs the supply-chain
  # check would be a supply-chain dependency the check does not cover, and
  # `cargo install` compiles the tool and its own graph on every run.
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same releases and sha256 as agent-fabric-gateway's and InterWeave's
    # CI and their projects/registry.json install pins; a bump moves them
    # together. cargo-machete's tag and asset add a `v` to the version.
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
      CARGO_MACHETE_VERSION: "0.9.2"
      CARGO_MACHETE_SHA256: "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # cargo metadata, which both tools read, needs the toolchain.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install cargo-deny
        run: |
          set -euo pipefail
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${asset}"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$url"
          (cd "$RUNNER_TEMP" && echo "${CARGO_DENY_SHA256}  ${asset}" | sha256sum --check --strict)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$asset" --strip-components=1 -C "$RUNNER_TEMP/bin" \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cargo-deny" --version

      - name: Install cargo-machete
        run: |
          set -euo pipefail
          asset="cargo-machete-v${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/bnjbvr/cargo-machete/releases/download/v${CARGO_MACHETE_VERSION}/${asset}"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$url"
          (cd "$RUNNER_TEMP" && echo "${CARGO_MACHETE_SHA256}  ${asset}" | sha256sum --check --strict)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$asset" --strip-components=1 -C "$RUNNER_TEMP/bin" \
            "cargo-machete-v${CARGO_MACHETE_VERSION}-x86_64-unknown-linux-musl/cargo-machete"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cargo-machete" --version

      - name: Dependency policy
        run: cargo-deny --log-level warn --all-features check

      # scripts/cargo_machete.py: a crate the tool could not read is a
      # failure, not a pass.
      - name: Unused dependencies
        run: python3 scripts/cargo_machete.py

  # The fleet runs on Debian and Fedora only: this leg on the Ubuntu runner,
  # and check-distro below in Debian and Fedora containers, both running
  # these steps. Upstream herdr's macOS and Windows legs are not run here.
  check:
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEG: ubuntu-latest
    steps: &check-steps
      # What the steps below, and the tests (ssh for the remote-attach
      # probe, ps for the session tests, openssl for the installer's
      # checksum test), assume a host already has.
      - name: Container prerequisites (Debian)
        if: startsWith(env.LEG, 'debian')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3 xz-utils unzip openssh-client procps openssl

      - name: Container prerequisites (Fedora)
        if: startsWith(env.LEG, 'fedora')
        run: dnf install -y curl git gcc gcc-c++ make pkgconf-pkg-config python3 xz unzip tar findutils which openssh-clients procps-ng openssl

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy

      - name: Install Rust tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Persist both Zig caches; build outputs otherwise stay uncached in
      # Cargo's OUT_DIR. Set from $GITHUB_WORKSPACE in a step: in a container
      # job the github.workspace expression is the host path, not /__w.
      - name: Zig cache directories
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"

      # Zig downloads come from ziglang.org or a random community mirror and
      # vary from seconds to minutes; reuse the verified install instead.
      # Ubuntu leg only: in a container runner.temp is the host path, and the
      # key is not per leg; the containers install Zig fresh.
      - name: Restore Zig compiler
        if: env.LEG == 'ubuntu-latest'
        id: zig-compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Install Zig
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      # Zig's C-header cache keys include the compiler installation path.
      - name: Stabilize Zig installation path
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          stable_zig="$RUNNER_TEMP/herdr-zig-0.16.0"
          if [ "$ZIG_RESTORED" != "true" ]; then
            mv "$(dirname "$(command -v zig)")" "$stable_zig"
          fi
          echo "$stable_zig" >> "$GITHUB_PATH"
          echo "ZIG=$stable_zig/zig" >> "$GITHUB_ENV"

      - name: Save Zig compiler
        if: env.LEG == 'ubuntu-latest' && steps.zig-compiler.outputs.cache-hit != 'true' && env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Restore Zig build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-${{ env.LEG }}-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-build-v1-${{ env.LEG }}-${{ runner.arch }}-0.16.0-

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          key: ${{ env.LEG }}
          save-if: ${{ env.SAVE_CACHES }}

      # Cargo still rebuilds workspace targets; only rustc's validated query state is retained.
      - name: Restore incremental compiler state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/incremental
          key: ci-incremental-v1-${{ env.LEG }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'build.rs', 'crates/*/Cargo.toml', 'crates/*/build.rs') }}-${{ github.sha }}
          restore-keys: |
            ci-incremental-v1-${{ env.LEG }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'build.rs', 'crates/*/Cargo.toml', 'crates/*/build.rs') }}-

      - name: Run Linux lint
        run: CARGO_INCREMENTAL=1 just lint

      - name: Run Linux tests
        run: CARGO_INCREMENTAL=1 just ci-tests 'all()'

      - name: Check scalar libghostty with runtime safety
        env:
          LIBGHOSTTY_VT_SIMD: "false"
          LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
        run: CARGO_INCREMENTAL=1 cargo nextest run --locked -E 'package(ghostty-vt) | test(ghostty)' --status-level fail --final-status-level fail --failure-output final --success-output never

      - name: Save incremental compiler state
        if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/incremental
          key: ci-incremental-v1-${{ env.LEG }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'build.rs', 'crates/*/Cargo.toml', 'crates/*/build.rs') }}-${{ github.sha }}

      - name: Save Zig build cache
        if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-${{ env.LEG }}-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}

  check-distro:
    name: check (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: debian-12
            image: debian:12
          - leg: fedora-42
            image: fedora:42
    runs-on: ubuntu-latest
    # --init: a container has no init to reap a killed child, so it would
    # linger as a zombie that kill(pid, 0) still finds; on a real Debian or
    # Fedora host systemd reaps it.
    container:
      image: ${{ matrix.image }}
      options: --init
    timeout-minutes: 20
    env:
      LEG: ${{ matrix.leg }}
    steps: *check-steps
