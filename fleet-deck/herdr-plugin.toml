# Fleet Deck's views (gzapi-org's fork): what the fleet does, read when a
# view is open and focused. See README.md, "Views".
id = "fabric.fleet"
name = "Fleet views"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "The fleet tab (board, compare, plans), an agent's overlay and the PRs popup, from agent-fabric's fleet.py"
platforms = ["linux"]

[[actions]]
id = "board"
title = "Fleet board"
contexts = ["global"]
command = ["./fabric-view", "open", "board"]

[[actions]]
id = "agent"
title = "This agent"
contexts = ["tab", "pane"]
command = ["./fabric-view", "open", "agent"]

[[actions]]
id = "prs"
title = "Pull requests in flight"
contexts = ["global"]
command = ["./fabric-view", "open", "prs"]

# Asks first in its popup (typing "stop"), then stops detached: herdr's stop
# closes the popup it was asked in.
[[actions]]
id = "stop"
title = "Stop the whole fleet..."
contexts = ["global"]
command = ["./fabric-view", "open", "stop"]

[[panes]]
id = "board"
title = "fleet"
placement = "tab"
command = ["./fabric-view", "board"]

[[panes]]
id = "agent"
title = "agent"
placement = "overlay"
command = ["./fabric-view", "agent"]

[[panes]]
id = "prs"
title = "pull requests"
placement = "popup"
command = ["./fabric-view", "prs"]

[[panes]]
id = "stop"
title = "stop the fleet"
placement = "popup"
command = ["./fleet-deck", "stop", "--all", "--confirm"]
